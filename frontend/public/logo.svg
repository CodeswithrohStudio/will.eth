<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Multi-layer halo glow -->
    <filter id="halo-glow" x="-80%" y="-200%" width="260%" height="500%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="2.5" result="blur2" in="SourceGraphic"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Halo outer diffuse glow (large, soft) -->
  <ellipse cx="60" cy="28" rx="28" ry="9"
    stroke="#4ADE80" stroke-width="10" opacity="0.15"
    filter="url(#halo-glow)"/>

  <!-- Halo mid glow -->
  <ellipse cx="60" cy="28" rx="28" ry="9"
    stroke="#22C55E" stroke-width="5" opacity="0.45"
    filter="url(#halo-glow)"/>

  <!-- Halo crisp ring (sharp, bright) -->
  <ellipse cx="60" cy="28" rx="28" ry="9"
    stroke="#5BFF9F" stroke-width="2.8" opacity="0.95"/>

  <!-- Key bow (circle ring) -->
  <circle cx="60" cy="60" r="17" stroke="white" stroke-width="9"/>

  <!-- Key shaft -->
  <line x1="60" y1="77" x2="60" y2="106"
    stroke="white" stroke-width="9" stroke-linecap="round"/>

  <!-- Upper tooth -->
  <line x1="60" y1="89" x2="75" y2="89"
    stroke="white" stroke-width="7.5" stroke-linecap="round"/>

  <!-- Lower tooth -->
  <line x1="60" y1="103" x2="75" y2="103"
    stroke="white" stroke-width="7.5" stroke-linecap="round"/>
</svg>
