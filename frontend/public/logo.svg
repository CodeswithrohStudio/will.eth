<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Green glow halo ring above the key bow -->
  <defs>
    <filter id="halo-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="key-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Halo ring (perspective ellipse, tilted) -->
  <ellipse
    cx="60" cy="28"
    rx="26" ry="8"
    stroke="#4ADE80"
    stroke-width="4.5"
    stroke-linecap="round"
    filter="url(#halo-glow)"
  />

  <!-- Key bow (circle outline) -->
  <circle
    cx="60" cy="58"
    r="17"
    stroke="white"
    stroke-width="8"
    filter="url(#key-glow)"
  />

  <!-- Key shaft -->
  <line
    x1="60" y1="75"
    x2="60" y2="103"
    stroke="white"
    stroke-width="8"
    stroke-linecap="round"
  />

  <!-- Key teeth (two horizontal bits on right side) -->
  <line
    x1="60" y1="88"
    x2="73" y2="88"
    stroke="white"
    stroke-width="6.5"
    stroke-linecap="round"
  />
  <line
    x1="60" y1="100"
    x2="73" y2="100"
    stroke="white"
    stroke-width="6.5"
    stroke-linecap="round"
  />
</svg>
